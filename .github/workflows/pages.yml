name: Deploy Tileform to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify settings and maximum size
        run: node scripts/verify-settings.mjs
      - name: Verify printable geometry
        run: node scripts/verify.mjs
      - name: Verify browser interactions
        run: node scripts/verify-browser.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published site
        env:
          TILEFORM_SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/verify-browser.mjs
